name: ReiFlix Prompt 14.2 No-Emulator Contract Checks

on:
  workflow_dispatch:

jobs:
  python-contracts:
    name: Python contracts (no emulator)
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "flet[cli]==0.86.5" pytest
      - name: Compile Python sources
        run: python -m compileall .
      - name: Run pytest
        run: pytest -q
      - name: Run unittest discovery
        run: python -m unittest discover -s tests -p 'test*.py' -t .
      - name: Check diff whitespace
        run: git diff --check

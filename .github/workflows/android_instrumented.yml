name: ReiAnix Android Instrumented Runtime Matrix

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Each commit gets an independent certification slot so a stuck prior emulator run cannot block the current SHA.
  group: reiflix-android-instrumented-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  python-contracts:
    name: Python contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "flet[cli]==0.86.5" pytest
      - name: Compile Python sources
        run: python -m compileall -q main.py app_config.py core views scripts
      - name: Run full Python tests
        run: |
          python -m pytest -q
          python -m unittest discover -s tests -p 'test*.py' -t .
      - name: Check diff whitespace
        run: git diff --check

  prepare-android-test-project:
    name: Render Android test project
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true
      - name: Accept Android SDK licenses and install platform
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager_path="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$sdkmanager_path"
          set +o pipefail
          yes | "$sdkmanager_path" --licenses >/dev/null
          set -o pipefail
          "$sdkmanager_path" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "emulator"
      - name: Install Flet build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "flet[cli]==0.86.5"
      - name: Generate deterministic player fixture
        run: |
          python scripts/create_player_fixture.py
          test -s android/app/src/androidTest/assets/player_fixture.mp4
      - name: Prepare Flet template with ReiAnix Android host
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          curl -sSL -o build/flet-build-template.zip https://github.com/flet-dev/flet/releases/download/v0.86.5/flet-build-template.zip
          mkdir -p build/temp_tmpl build/flet-build-template
          unzip -q build/flet-build-template.zip -d build/temp_tmpl
          cp -a build/temp_tmpl/build/. build/flet-build-template/
          rm -rf build/temp_tmpl build/flet-build-template.zip
          python scripts/prepare_flet_template.py             --template "$GITHUB_WORKSPACE/build/flet-build-template"             --overlay "$GITHUB_WORKSPACE/android"
      - name: Render Android Gradle project
        shell: bash
        run: |
          set -euo pipefail
          git_backup_root="$(mktemp -d)"
          git_backup="$git_backup_root/.git"
          mv .git "$git_backup"
          restore_git() {
            if [ -d "$git_backup" ] && [ ! -e .git ]; then
              mv "$git_backup" .git
            fi
            rmdir "$git_backup_root"
          }
          trap restore_git EXIT
          flet build apk             --template build/flet-build-template             --build-number "$GITHUB_RUN_NUMBER"             --build-version "0.2.1"             --python-version "3.12"             --yes
      - name: Verify rendered Android test project
        run: |
          test -f build/flutter/android/gradlew
          test -f build/flutter/android/app/build.gradle.kts
          for test_file in \
            NativePlayerPlaybackInstrumentedTest.kt \
            BackAndSettingsReturnInstrumentedTest.kt \
            DeviceFlowInstrumentedTest.kt \
            NativeIndexInstrumentedTest.kt \
            NativeMailboxInstrumentedTest.kt; do
            test -f "build/flutter/android/app/src/androidTest/kotlin/com/reiflix/reiflix_local/$test_file"
          done
      # Cache the rendered Android project directly. This avoids a second
      # tar/extract layer and guarantees every matrix job receives the same
      # generated Gradle wrapper and source tree.
      - name: Verify rendered Android project integrity
        shell: bash
        run: |
          set -euo pipefail
          test -f build/flutter/android/gradlew
          test -f build/flutter/android/settings.gradle
          test -f build/flutter/android/app/build.gradle.kts
          test -d build/flutter/android/app/src/androidTest
      - name: Cache rendered Android test project
        uses: actions/cache/save@v4
        with:
          path: build/flutter/android
          key: reianix-android-test-project-v2-${{ github.sha }}


  instrumented:
    name: Android API ${{ matrix.api }}
    needs: prepare-android-test-project
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [30, 36]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Accept Android SDK licenses and install emulator dependencies
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager_path="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$sdkmanager_path"
          set +o pipefail
          yes | "$sdkmanager_path" --licenses >/dev/null
          set -o pipefail
          "$sdkmanager_path" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "platforms;android-${{ matrix.api }}" "emulator"
      - name: Restore rendered Android test project
        uses: actions/cache/restore@v4
        with:
          path: build/flutter/android
          key: reianix-android-test-project-v2-${{ github.sha }}
      - name: Verify restored Android test project
        shell: bash
        run: |
          set -euo pipefail
          test -f build/flutter/android/gradlew
          test -f build/flutter/android/settings.gradle
          test -f build/flutter/android/app/build.gradle.kts
          test -d build/flutter/android/app/src/androidTest
          chmod +x build/flutter/android/gradlew
      - name: Run instrumented tests on API ${{ matrix.api }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          disable-animations: false
          emulator-options: "-no-window -no-audio -no-boot-anim -no-snapshot -no-snapshot-save -gpu swiftshader_indirect -camera-back none -camera-front none"
          script: |
            bash -euo pipefail <<'REIFLIX_ANDROID_INSTRUMENTED_SCRIPT'
            mkdir -p "$GITHUB_WORKSPACE/build/android-api${{ matrix.api }}"
            # The emulator runner can report boot completion while adb is still
            # temporarily offline. Do not start Gradle until adb is actually ready.
            wait_for_adb_ready() {
              for attempt in $(seq 1 90); do
                state=""
                if ! state="$(adb get-state 2>/dev/null)"; then
                  state=""
                fi
                if [ "$state" = "device" ] && adb shell getprop sys.boot_completed 2>/dev/null | grep -qx "1"; then
                  return 0
                fi
                sleep 2
              done
              echo "ADB did not become ready in time."
              adb devices -l
              return 1
            }
            wait_for_adb_ready
            adb shell settings put global window_animation_scale 0.0
            adb shell settings put global transition_animation_scale 0.0
            adb shell settings put global animator_duration_scale 0.0
            adb shell settings get global window_animation_scale
            adb shell settings get global transition_animation_scale
            adb shell settings get global animator_duration_scale
            cd "$GITHUB_WORKSPACE/build/flutter/android"
            chmod +x gradlew
            log="$GITHUB_WORKSPACE/build/android-api${{ matrix.api }}/connectedDebugAndroidTest.log"
            set +e
            ./gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace 2>&1 | tee "$log"
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -ne 0 ]; then
              echo "connectedDebugAndroidTest failed with exit=$status"
              exit "$status"
            fi
            echo "connectedDebugAndroidTest VALIDATED api=${{ matrix.api }}"
            REIFLIX_ANDROID_INSTRUMENTED_SCRIPT
      - name: Summarize instrumented test failures
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/build/flutter/android"
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          roots = [
              Path("app/build/outputs/androidTest-results"),
              Path("app/build/outputs/androidTest-results/connected"),
              Path("app/build/test-results"),
              Path("app/build/outputs"),
          ]
          xml_files = []
          seen = set()
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob("*.xml"):
                  if path in seen:
                      continue
                  seen.add(path)
                  xml_files.append(path)

          failures = []
          for path in xml_files:
              try:
                  root = ET.parse(path).getroot()
              except (ET.ParseError, OSError):
                  continue
              for testcase in root.iter("testcase"):
                  error_nodes = [child for child in testcase if child.tag.rsplit("}", 1)[-1] in {"failure", "error"}]
                  if not error_nodes:
                      continue
                  classname = testcase.attrib.get("classname", "")
                  name = testcase.attrib.get("name", "")
                  detail = ""
                  if error_nodes:
                      detail = " ".join((error_nodes[0].text or "").split())[:1200]
                  failures.append((classname, name, detail, str(path)))

          print(f"INSTRUMENTED_RESULT_FILES={len(xml_files)}")
          if not failures:
              print("INSTRUMENTED_FAILURES=0")
          else:
              print(f"INSTRUMENTED_FAILURES={len(failures)}")
              for classname, name, detail, path in failures:
                  print(f"INSTRUMENTED_TEST_FAILURE={classname}#{name}")
                  if detail:
                      print(f"INSTRUMENTED_TEST_FAILURE_DETAIL={detail}")
                  print(f"INSTRUMENTED_TEST_RESULT_FILE={path}")
          PY

          log="$(find "$GITHUB_WORKSPACE/build" -type f -name 'connectedDebugAndroidTest.log' -print -quit)"
          if [ -n "$log" ]; then
            echo "===== CONNECTED_TEST_LOG_FAILURE_CONTEXT ====="
            set +e
            grep -n -E 'FAILED|FAILURE|There were failing tests|Test run failed|Exception|AssertionError' "$log" | tail -n 120
            grep_status=${PIPESTATUS[0]}
            set -e
            if [ "$grep_status" -gt 1 ]; then
              echo "INSTRUMENTED_TEST_LOG_GREP_FAILED=$grep_status"
              exit "$grep_status"
            fi
          else
            echo "INSTRUMENTED_TEST_LOG=NOT_FOUND"
          fi

      - name: Capture Android runtime diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          out="$GITHUB_WORKSPACE/build/android-api${{ matrix.api }}"
          mkdir -p "$out"

          # Diagnostic collection must never hide or change the preceding
          # instrumentation result. Each individual adb command is bounded so
          # a wedged emulator cannot prevent the evidence directory from being
          # uploaded after a real test failure.
          capture() {
            local output="$1"
            shift
            timeout --signal=TERM --kill-after=5s 30s "$@" >"$output" 2>&1
            local status=$?
            if [ "$status" -ne 0 ]; then
              printf '\nCOMMAND_EXIT=%s\n' "$status" >>"$output"
            fi
            return 0
          }

          capture "$out/adb_devices.txt" adb devices -l
          capture "$out/sdk.txt" adb shell getprop ro.build.version.sdk
          capture "$out/activity_top.txt" adb shell dumpsys activity top
          capture "$out/window.txt" adb shell dumpsys window
          capture "$out/logcat.txt" adb logcat -d -v threadtime
          {
            echo "## Android runtime diagnostics"
            echo '```'
            if [ -f "$out/sdk.txt" ]; then
              cat "$out/sdk.txt"
            fi
            echo "--- adb devices ---"
            if [ -f "$out/adb_devices.txt" ]; then
              cat "$out/adb_devices.txt"
            fi
            echo "--- command exit markers ---"
            grep -h "COMMAND_EXIT=" "$out"/*.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          set -e

  instrumented-tv:
    name: Android TV API 36
    needs: prepare-android-test-project
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Restore rendered Android test project
        uses: actions/cache/restore@v4
        with:
          path: build/flutter/android
          key: reianix-android-test-project-v2-${{ github.sha }}
      - name: Verify restored Android test project
        shell: bash
        run: |
          set -euo pipefail
          test -f build/flutter/android/gradlew
          test -f build/flutter/android/settings.gradle
          test -f build/flutter/android/app/build.gradle.kts
          test -d build/flutter/android/app/src/androidTest
          chmod +x build/flutter/android/gradlew
      - name: Run instrumented tests on Android TV API 36
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          system-image-api-level: 36
          target: android-tv
          arch: x86_64
          force-avd-creation: true
          emulator-boot-timeout: 600
          disable-animations: false
          emulator-options: "-no-window -no-audio -no-boot-anim -no-snapshot -no-snapshot-save -gpu swiftshader_indirect -camera-back none -camera-front none"
          script: |
            bash -euo pipefail <<'REIFLIX_ANDROID_TV_SCRIPT'
            mkdir -p "$GITHUB_WORKSPACE/build/android-tv-api36"
            # Android TV can publish boot completion before adb/input services are ready.
            wait_for_adb_ready() {
              for attempt in $(seq 1 120); do
                state=""
                if ! state="$(adb get-state 2>/dev/null)"; then
                  state=""
                fi
                if [ "$state" = "device" ] && adb shell getprop sys.boot_completed 2>/dev/null | grep -qx "1"; then
                  return 0
                fi
                sleep 2
              done
              echo "ADB did not become ready in time."
              adb devices -l
              return 1
            }
            wait_for_adb_ready
            adb shell settings put global window_animation_scale 0.0
            adb shell settings put global transition_animation_scale 0.0
            adb shell settings put global animator_duration_scale 0.0
            adb shell settings get global window_animation_scale
            adb shell settings get global transition_animation_scale
            adb shell settings get global animator_duration_scale
            cd "$GITHUB_WORKSPACE/build/flutter/android"
            chmod +x gradlew
            log="$GITHUB_WORKSPACE/build/android-tv-api36/connectedDebugAndroidTest.log"
            set +e
            ./gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace 2>&1 | tee "$log"
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -ne 0 ]; then
              echo "connectedDebugAndroidTest failed on Android TV with exit=$status"
              exit "$status"
            fi
            echo "connectedDebugAndroidTest VALIDATED android-tv api=36"
            REIFLIX_ANDROID_TV_SCRIPT
      - name: Capture Android TV runtime diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          out="$GITHUB_WORKSPACE/build/android-tv-api36"
          mkdir -p "$out"

          # Keep evidence collection bounded without changing the test result:
          # this step is diagnostic-only and runs after instrumentation.
          capture() {
            local output="$1"
            shift
            timeout --signal=TERM --kill-after=5s 30s "$@" >"$output" 2>&1
            local status=$?
            if [ "$status" -ne 0 ]; then
              printf '\nCOMMAND_EXIT=%s\n' "$status" >>"$output"
            fi
            return 0
          }

          capture "$out/adb_devices.txt" adb devices -l
          capture "$out/sdk.txt" adb shell getprop ro.build.version.sdk
          capture "$out/characteristics.txt" adb shell getprop ro.build.characteristics
          capture "$out/package.txt" adb shell dumpsys package com.reiflix.reiflix_local
          capture "$out/activity_top.txt" adb shell dumpsys activity top
          capture "$out/window.txt" adb shell dumpsys window
          capture "$out/logcat.txt" adb logcat -d -v threadtime
          {
            echo "## Android runtime diagnostics"
            echo '```'
            if [ -f "$out/sdk.txt" ]; then
              cat "$out/sdk.txt"
            fi
            echo "--- adb devices ---"
            if [ -f "$out/adb_devices.txt" ]; then
              cat "$out/adb_devices.txt"
            fi
            echo "--- command exit markers ---"
            grep -h "COMMAND_EXIT=" "$out"/*.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          set -e

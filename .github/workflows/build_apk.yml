name: Build ReiFlix Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;36.0.0 platforms;android-36 cmdline-tools;latest'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Install Android platform
        run: sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Install Python and Flet build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "flet[cli]==0.86.5"
          flet --version
          flutter --version

      - name: Validate public Google configuration for Android build
        shell: bash
        env:
          REIFLIX_GOOGLE_WEB_CLIENT_ID: ${{ vars.REIFLIX_GOOGLE_WEB_CLIENT_ID || secrets.REIFLIX_GOOGLE_WEB_CLIENT_ID }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          value = os.environ.get("REIFLIX_GOOGLE_WEB_CLIENT_ID", "").strip()
          if value and not value.endswith(".apps.googleusercontent.com"):
              raise SystemExit("REIFLIX_GOOGLE_WEB_CLIENT_ID must be a Google OAuth Web client ID")
          path = Path("app_config.py")
          text = path.read_text(encoding="utf-8")
          marker = 'GOOGLE_WEB_CLIENT_ID = ""'
          path.write_text(text.replace(marker, f'GOOGLE_WEB_CLIENT_ID = {value!r}'), encoding="utf-8")
          print("Google Web Client ID injected into this APK build:" + (" yes" if value else " no (login will show configuration required)"))
          PY

      - name: Validate JSON configuration
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            if grep -q "{{cookiecutter." "$file" || grep -q "{%" "$file"; then
              echo "Unrendered Jinja JSON template (skipped): $file"
              continue
            fi
            python -m json.tool "$file" >/dev/null
            echo "Valid JSON: $file"
          done < <(find . -path './.git' -prune -o -path './build' -prune -o -type f -name '*.json' -print0)

      - name: Validate Python application
        run: |
          python -m compileall -q main.py app_config.py core views
          python -m unittest discover -s tests -v
          git diff --check

      - name: Prepare Flet build template with Android host
        run: |
          mkdir -p build
          curl -sSL -o build/flet-build-template.zip https://github.com/flet-dev/flet/releases/download/v0.86.5/flet-build-template.zip
          mkdir -p build/temp_tmpl
          unzip -q build/flet-build-template.zip -d build/temp_tmpl
          mkdir -p build/flet-build-template
          cp -a build/temp_tmpl/build/. build/flet-build-template/
          rm -rf build/temp_tmpl build/flet-build-template.zip
          python scripts/prepare_flet_template.py \
            --template "$GITHUB_WORKSPACE/build/flet-build-template" \
            --overlay "$GITHUB_WORKSPACE/android"

      - name: Fix generated JSON files
        shell: bash
        run: |
          python - <<'PY'
          import glob
          import json

          def strip_trailing_commas(raw):
              out = []
              in_string = False
              escaped = False
              i = 0
              while i < len(raw):
                  char = raw[i]
                  if in_string:
                      out.append(char)
                      if escaped:
                          escaped = False
                      elif char == chr(92):
                          escaped = True
                      elif char == chr(34):
                          in_string = False
                      i += 1
                      continue
                  if char == chr(34):
                      in_string = True
                      out.append(char)
                      i += 1
                      continue
                  if char == chr(44):
                      j = i + 1
                      while j < len(raw) and raw[j] in " \t\r\n":
                          j += 1
                      if j < len(raw) and raw[j] in "}]":
                          i = j
                          continue
                  out.append(char)
                  i += 1
              return "".join(out)

          for path in glob.glob("build/flet-build-template/**/*.json", recursive=True):
              with open(path, "r", encoding="utf-8") as handle:
                  raw = handle.read()
              if "{{cookiecutter." in raw or "{%" in raw:
                  print(f"Unrendered Jinja JSON template (skipped): {path}")
                  continue
              cleaned = strip_trailing_commas(raw)
              try:
                  data = json.loads(cleaned)
              except json.JSONDecodeError as exc:
                  raise SystemExit(f"Invalid generated JSON {path}: {exc}") from exc
              with open(path, "w", encoding="utf-8") as handle:
                  json.dump(data, handle, indent=2)
          PY

      - name: Run Android unit tests
        shell: bash
        run: |
          cd build/flet-build-template
          ./gradlew testDebugUnitTest --no-daemon --stacktrace
          cd "$GITHUB_WORKSPACE"

      - name: Build APK
        run: flet build apk --template build/flet-build-template --yes -v

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          apk="$(find build -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          test -s "$apk"
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          file "$apk"

      - name: Verify final APK permissions and target SDK
        shell: bash
        run: |
          apk="${{ steps.apk.outputs.path }}"
          aapt2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          badging="$("$aapt2" dump badging "$apk")"
          echo "$badging" | grep -q "package: name='com.reiflix.reiflix_local'"
          echo "$badging" | grep -q "versionCode='1'"
          echo "$badging" | grep -q "versionName='0.2.0'"
          echo "$badging" | grep -q "targetSdkVersion:'36'"
          "$aapt2" dump permissions "$apk" | grep -q "android.permission.MANAGE_EXTERNAL_STORAGE"
          "$aapt2" dump permissions "$apk" | grep -q "android.permission.READ_MEDIA_VIDEO"

      - name: Verify Android host packaging
        shell: bash
        run: |
          apk="${{ steps.apk.outputs.path }}"
          python scripts/verify_android_host.py "$apk"

      - name: Verify effective APK AndroidManifest
        shell: bash
        run: |
          apk="${{ steps.apk.outputs.path }}"
          python scripts/verify_apk_manifest.py "$apk" --aapt2 "$ANDROID_HOME/build-tools/36.0.0/aapt2"

      - name: Print and publish APK SHA-256
        shell: bash
        run: |
          apk="${{ steps.apk.outputs.path }}"
          sha256sum "$apk" | tee "${apk}.sha256"
          echo "commit_sha=${GITHUB_SHA}"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$apk" | grep -E "package: name=|versionCode=|versionName="

      - name: Print APK signing certificate fingerprints
        shell: bash
        run: |
          apk="${{ steps.apk.outputs.path }}"
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$apksigner" verify --verbose --print-certs "$apk"

      - name: Upload APK and SHA-256 artifact
        uses: actions/upload-artifact@v4
        with:
          name: reiflix-local-apk
          path: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.apk.outputs.path }}.sha256
          if-no-files-found: error

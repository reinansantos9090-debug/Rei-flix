name: Build ReiFlix Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools build-tools;35.0.0 platforms;android-35 cmdline-tools;latest"

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install Android platform
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Install Python and Flet build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "flet[cli]==0.86.5"
          flet --version
          flutter --version

      - name: Validate JSON configuration
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            python -m json.tool "$file" >/dev/null
            echo "Valid JSON: $file"
          done < <(
            find . \
              -path './.git' -prune -o \
              -path './build' -prune -o \
              -type f -name '*.json' -print0
          )

      - name: Validate Python application
        run: |
          python -m compileall -q main.py app_config.py core views
          git diff --check

      - name: Download exact Flet 0.86.5 build template
        shell: bash
        run: |
          rm -rf build/flet-build-template
          mkdir -p build

          curl -fL \
            "https://github.com/flet-dev/flet/releases/download/v0.86.5/flet-build-template.zip" \
            -o /tmp/flet-build-template.zip

          rm -rf /tmp/flet-template
          mkdir -p /tmp/flet-template

          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import shutil

          archive = Path("/tmp/flet-build-template.zip")
          destination = Path("/tmp/flet-template")

          with ZipFile(archive) as z:
              z.extractall(destination)

          candidates = list(destination.rglob("cookiecutter.json"))

          if not candidates:
              raise SystemExit(
                  "ERRO: cookiecutter.json não encontrado no template Flet 0.86.5."
              )

          if len(candidates) > 1:
              raise SystemExit(
                  "ERRO: mais de um cookiecutter.json encontrado no template."
              )

          template = candidates[0].parent
          output = Path("build/flet-build-template")

          output.parent.mkdir(parents=True, exist_ok=True)
          shutil.copytree(template, output)

          print(f"Template Flet 0.86.5 preparado em: {output}")
          PY

          test -f build/flet-build-template/cookiecutter.json

          echo "Template usado:"
          find build/flet-build-template -maxdepth 2 -type f | sort | head -50

      - name: Prepare Flet build template with Android host
        run: |
          python scripts/prepare_flet_template.py \
            --template build/flet-build-template \
            --overlay android

      - name: Validate prepared Flet template
        shell: bash
        run: |
          test -f build/flet-build-template/cookiecutter.json
          test -f build/flet-build-template/hooks/post_gen_project.py

          echo "Android host overlay:"
          find build/flet-build-template/reiflix_android_overlay \
            -type f | sort

          echo "Cookiecutter hooks:"
          find build/flet-build-template/hooks \
            -maxdepth 1 \
            -type f \
            -print

      - name: Build APK using prepared template
        shell: bash
        run: |
          flet build apk \
            --template build/flet-build-template \
            --yes \
            -v

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          apk="$(find build -type f -name '*.apk' -print -quit)"

          test -n "$apk"
          test -s "$apk"

          echo "APK encontrado:"
          echo "$apk"

          echo "path=$apk" >> "$GITHUB_OUTPUT"

          file "$apk"

      - name: Verify Android host packaging
        shell: bash
        run: |
          apk="${{ steps.apk.outputs.path }}"

          python scripts/verify_android_host.py "$apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: reiflix-local-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error


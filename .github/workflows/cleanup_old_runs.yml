name: Cleanup old GitHub Actions runs

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Keep newest 500 workflow runs
    runs-on: ubuntu-latest
    steps:
      - name: Delete runs older than the newest 500
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          KEEP_RUNS: "500"
        shell: bash
        run: |
          set -euo pipefail

          api="https://api.github.com/repos/${REPOSITORY}/actions/runs"
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT

          echo "Collecting workflow runs..."
          page=1
          while :; do
            response="$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "${api}?per_page=100&page=${page}")"

            count="$(jq '.workflow_runs | length' <<<"${response}")"
            [ "${count}" -eq 0 ] && break

            jq -c '.workflow_runs[] | {id, run_number, name, created_at, status}' <<<"${response}" >> "${tmp}"

            echo "Collected page ${page}: ${count} runs"
            [ "${count}" -lt 100 ] && break
            page=$((page + 1))
          done

          total="$(wc -l < "${tmp}" | tr -d ' ')"
          echo "Total runs found: ${total}"

          if [ "${total}" -le "${KEEP_RUNS}" ]; then
            echo "Nothing to delete. Fewer than or equal to ${KEEP_RUNS} runs exist."
            exit 0
          fi

          delete_count=$((total - KEEP_RUNS))
          echo "Keeping newest ${KEEP_RUNS} runs and deleting ${delete_count} older runs."

          jq -s -r 'sort_by(.created_at) | reverse | .['"${KEEP_RUNS}"':] | .[] | [.id, .run_number, .name, .created_at, .status] | @tsv' "${tmp}" |
          while IFS=$'\t' read -r run_id run_number run_name created_at status; do
            echo "Deleting run #${run_number} (${run_id}) - ${run_name} - ${created_at} - ${status}"
            curl -fsSL -X DELETE \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "${api}/${run_id}"
          done

          echo "Cleanup finished. The newest ${KEEP_RUNS} workflow runs were preserved."

name: Prompt 11 Focused Validation

on:
  push:
    branches: [prompt-11-details-hero]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify exact source commit and core icons
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          ! grep -R -n --include='*.kt' 'StarBorder' android/app/src/main/kotlin
          grep -R -n --include='*.kt' 'FavoriteBorder' android/app/src/main/kotlin

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;36.0.0 platforms;android-36 emulator'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Install validation dependencies
        run: |
          python -m pip install -r requirements.txt "flet[cli]==0.86.5" pytest
          python -m pytest -q tests/test_compose_library_bridge.py

      - name: Prepare Flet build template with Android host
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build "$HOME/.cache/reiflix"
          template_zip="$HOME/.cache/reiflix/flet-build-template-v0.86.5.zip"
          if [ ! -s "$template_zip" ]; then
            curl -fsSL --retry 3 --retry-delay 2 -o "$template_zip" https://github.com/flet-dev/flet/releases/download/v0.86.5/flet-build-template.zip
          fi
          mkdir -p build/temp_tmpl build/flet-build-template
          unzip -q "$template_zip" -d build/temp_tmpl
          cp -a build/temp_tmpl/build/. build/flet-build-template/
          rm -rf build/temp_tmpl
          python scripts/prepare_flet_template.py             --template "$GITHUB_WORKSPACE/build/flet-build-template"             --overlay "$GITHUB_WORKSPACE/android"

      - name: Build APK
        shell: bash
        env:
          GRADLE_OPTS: "-Dorg.gradle.caching=true -Dorg.gradle.parallel=true"
        run: |
          set -euo pipefail
          git_backup_root="$(mktemp -d)"
          git_backup="$git_backup_root/.git"
          mv .git "$git_backup"
          restore_git() {
            if [ -d "$git_backup" ] && [ ! -e .git ]; then
              mv "$git_backup" .git
            fi
            rmdir "$git_backup_root"
          }
          trap restore_git EXIT
          flet build apk             --template build/flet-build-template             --build-number "$GITHUB_RUN_NUMBER"             --build-version "0.2.1"             --python-version "3.12"             --arch "arm64-v8a"             --yes             -v

      - name: Verify APK artifact
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find build -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          test -s "$apk"
          mkdir -p build/prompt11
          cp "$apk" build/prompt11/ReiAnix-Prompt11.apk
          sha256sum build/prompt11/ReiAnix-Prompt11.apk | tee build/prompt11/ReiAnix-Prompt11.apk.sha256

      - name: Run Details instrumentation test on Android 36
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-boot-timeout: 1200
          disable-animations: false
          disable-linux-hw-accel: false
          emulator-options: "-no-window -no-audio -no-boot-anim -no-snapshot -no-snapshot-save -gpu swiftshader_indirect -camera-back none -camera-front none"
          script: |
            set -euo pipefail
            cd "$GITHUB_WORKSPACE/build/flutter/android"
            chmod +x gradlew
            ./gradlew :app:connectedDebugAndroidTest               -Pandroid.testInstrumentationRunnerArguments.class=com.reiflix.reiflix_local.ui.details.ReiAnixDetailsInstrumentedTest

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ReiAnix-Prompt11-validation-$GITHUB_RUN_NUMBER
          path: |
            build/prompt11/ReiAnix-Prompt11.apk
            build/prompt11/ReiAnix-Prompt11.apk.sha256
            build/flutter/android/app/build/outputs/androidTest-results/**
            build/flutter/android/app/build/reports/androidTests/**
          retention-days: 1
          if-no-files-found: warn

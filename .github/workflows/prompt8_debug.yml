name: Prompt 8 debug validation

on:
  push:
    branches:
      - feat/prompt-8-artwork-engine-2

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python
        id: compile
        continue-on-error: true
        run: |
          python -m compileall -q main.py app_config.py core views scripts 2>compile-errors.txt
          echo "compile_exit=$?" >> compile-errors.txt
      - name: Upload compile diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prompt8-compile-diagnostics
          path: compile-errors.txt
      - name: Fail on compile error
        if: steps.compile.outcome == 'failure'
        run: exit 1
